name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Estás analizando el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            1. Lee el issue completo con `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json title,body,labels,comments`.
            2. Revisa el código del proyecto (game.js, index.html, style.css, CLAUDE.md) para entender la arquitectura y poder diagnosticar con contexto real.
            3. Si el evento que disparó este workflow es "edited" y el issue ya tiene un comentario tuyo anterior (uno que empiece con el encabezado "## 🔍 Diagnóstico de Claude"), compara el contenido actual del issue contra ese análisis previo:
               - Si el cambio es sustancial (el problema descrito cambió de forma relevante), procede a re-analizar y publica un nuevo comentario.
               - Si el cambio es trivial (typos, formato, etc.) y no afecta el diagnóstico previo, no hagas nada más y termina.
            4. Si es la primera vez que analizas este issue (evento "opened", o "edited" sin comentario previo tuyo), continúa con los pasos siguientes.
            5. Asigna las etiquetas que apliquen usando `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "..."`. SOLO puedes usar etiquetas de esta lista fija, exactamente como están escritas, y solo las que realmente apliquen: bug, documentation, enhancement, help wanted, good first issue, invalid, question, wontfix, duplicate, accessibility. No crees etiquetas nuevas. No quites etiquetas existentes que sigan aplicando.
            6. Redacta el comentario de diagnóstico en español, usando **Markdown válido para GitHub** (encabezados con `#`/`##`, listas con `-`, bloques de código con triple backtick y el lenguaje cuando aplique, texto en negritas con `**...**`, referencias a archivos con backticks). El comentario debe empezar exactamente con el encabezado `## 🔍 Diagnóstico de Claude` y tener esta estructura:
               - **Resumen del problema**
               - **Causa probable / hipótesis**
               - **Áreas o archivos afectados** (referencia archivos y, cuando puedas identificarlo, funciones o rangos de líneas relevantes de game.js/index.html/style.css, usando backticks, p. ej. `game.js:120`)
               - **Posible enfoque de solución** (a alto nivel, sin implementar código — es para que el equipo lo use como base al escribir la solución)
               - **Etiquetas asignadas**
               Escribe primero ese contenido en un archivo temporal (por ejemplo `/tmp/diagnostico.md`) y publícalo con `gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/diagnostico.md` en vez de pasar el texto inline, para evitar problemas de escapado de comillas/saltos de línea y asegurar que el Markdown se renderice correctamente en GitHub.

            No implementes código ni abras pull requests. Tu única salida es: labels en el issue y un comentario de diagnóstico bien formateado en Markdown.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*),Write(/tmp/**)"'
